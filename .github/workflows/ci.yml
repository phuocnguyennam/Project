name: CI — Test, Lint, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend_code: ${{ steps.filter.outputs.backend_code }}
      sam: ${{ steps.filter.outputs.sam }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_code:
              - 'backend/**'
            sam:
              - 'backend/**'
              - 'template.yaml'
              - 'samconfig.toml'
            frontend:
              - 'frontend/**'

  backend-test:
    name: Backend — Python Tests & Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check .
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=layer/python/shared --cov=functions --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  sam-build:
    name: SAM — Validate & Build
    needs: [detect-changes, backend-test]
    if: |
      always() &&
      needs.detect-changes.outputs.sam == 'true' &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: SAM Validate
        run: sam validate --lint
      - name: SAM Build
        run: sam build

  frontend-test:
    name: Frontend — TypeScript Tests & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Run tests with coverage
        run: npx vitest run --coverage
      - name: Build check
        run: npm run build
        env:
          VITE_API_GATEWAY_URL: https://placeholder.execute-api.ap-southeast-1.amazonaws.com/dev
          VITE_COGNITO_USER_POOL_ID: ap-southeast-1_placeholder
          VITE_COGNITO_CLIENT_ID: placeholder
          VITE_CLOUDFRONT_DOMAIN: placeholder.cloudfront.net
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  ci-summary:
    name: CI Summary
    needs: [backend-test, sam-build, frontend-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI Results Summary
        run: |
          get_status() {
            case "$1" in
              success)   echo "✅ Passed"   ;;
              skipped)   echo "⏭️ Skipped"  ;;
              cancelled) echo "⚠️ Cancelled" ;;
              *)         echo "❌ Failed"   ;;
            esac
          }

          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests & Lint | $(get_status '${{ needs.backend-test.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| SAM Validate & Build | $(get_status '${{ needs.sam-build.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests & Build | $(get_status '${{ needs.frontend-test.result }}') |" >> $GITHUB_STEP_SUMMARY
